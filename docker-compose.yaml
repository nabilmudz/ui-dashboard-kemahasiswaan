services:
  app-ui-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SSO_URL=${VITE_SSO_URL}
        - VITE_CLIENT_ID=${VITE_CLIENT_ID}
        - VITE_REDIRECT_URI=${VITE_REDIRECT_URI}
        - VITE_API_URL=${VITE_API_URL}
    networks:
      - proxy-tier

networks:
  proxy-tier:
    external: true
